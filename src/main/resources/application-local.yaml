spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/postgres?prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      # This clears any cached prepared statements before reusing the connection.
      connection-init-sql: "DISCARD ALL"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  output:
    ansi:
      enabled: ALWAYS
  kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: auth-service
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8082

client-url: http://localhost:3000

internal-services:
    bidding-service: http://localhost:8083
    identity-and-auth-service: http://localhost:8084

bidding-service:
    search: /api/v1/bid/search

identity-and-auth-service:
    get-preferred-contact-methods: /api/v1/app-user/internal/contacts/preferred-contact-methods
    get-user-by-id: /api/v1/app-user/{appUserId}

logging:
  level:
    root: info
    com.bidder.catalog-service: info

feature-flag:
    run-close-auction-schedule-job: false